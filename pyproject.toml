[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "parallax-line-delivery"
version = "1.0.0"
description = "Build Japanese PARALLAX research PDFs and deliver the latest issue through LINE."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "jsonschema[format]>=4.23,<5",
  "reportlab>=4.2,<5",
]

[project.optional-dependencies]
test = [
  "pypdf>=5,<7",
  "pytest>=8.3,<10",
]

[project.scripts]
parallax-build = "parallax_line_delivery.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
  "pdf: integration tests that render a temporary PDF (CI installs Noto CJK)",
]

